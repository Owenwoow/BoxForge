# Streamlit server configuration (hardened defaults: no telemetry, no dev
# toolbar, no stack traces shown to users). Override at runtime with env vars
# (STREAMLIT_SERVER_*) or CLI flags if needed.

[server]
headless = true            # no "open browser" prompt; run as a service
address = "0.0.0.0"        # listen on all interfaces (Codespaces port forwarding)
port = 8501
enableCORS = true          # keep same-origin protection on
enableXsrfProtection = true
maxUploadSize = 5          # MB; this app has no uploads, keep it tiny
maxMessageSize = 50        # MB; cap websocket payloads
fileWatcherType = "none"   # no source-reload watching in production

[browser]
gatherUsageStats = false   # do not phone home from a public server

[global]
developmentMode = false

[client]
toolbarMode = "minimal"    # hide the dev/deploy hamburger menu from visitors
showErrorDetails = false   # don't leak stack traces to end users

[theme]
base = "light"
