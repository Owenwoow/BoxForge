# One-command public deployment, using the image CI publishes to GHCR:
#
#     docker compose pull && docker compose up -d
#
# Pin a release with BOXFORGE_TAG (default `latest` = newest release; `edge` =
# current main), e.g. `BOXFORGE_TAG=0.2.0 docker compose up -d`.
# `docker compose up -d --build` still builds locally from this checkout.
#
# Then reverse-proxy port 8501 behind Nginx/Caddy/Traefik with TLS (see
# docs/deployment.md). The resource limits below are the real
# safety net on a shared VPS: CadQuery model builds are CPU/RAM heavy, so a
# hard ceiling keeps one abusive request from taking the whole box down.

services:
  boxforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/owenwoow/boxforge:${BOXFORGE_TAG:-latest}
    container_name: boxforge
    restart: unless-stopped
    ports:
      - "8501:8501"          # host:container -- change the host side to taste
    # Hard resource ceiling (honored by `docker compose up`, no swarm needed).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 512m
    # Belt-and-suspenders for older compose that ignores deploy.resources:
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256          # cap runaway process/thread spawns
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # Generated STL previews live here; wiped on restart, never touch the host.
      - /tmp:size=256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4).read()==b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
