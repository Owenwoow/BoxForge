# Tooling config only -- BoxForge is an app, not an installable package.
# Runtime deps live in requirements.txt, dev/CI deps in requirements-dev.txt.

[tool.pytest.ini_options]
# app.py / main.py import `box_builder` and `main` as top-level modules, so
# tests see box_generator/ the same way `streamlit run` does.
pythonpath = ["box_generator"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: builds real CadQuery geometry or boots the Streamlit app",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["packaging/boxforge.spec"]

[tool.ruff.lint]
# Correctness-focused set: pyflakes, pycodestyle errors/warnings, bugbear.
select = ["E4", "E7", "E9", "F", "W", "B"]
