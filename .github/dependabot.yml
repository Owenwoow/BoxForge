# Weekly update PRs into `dev`; CI runs the full test + image pipeline on each.
# Python deps are unpinned (requirements.txt), so CI always tests the latest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
