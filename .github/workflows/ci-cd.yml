name: CI/CD

# The whole lifecycle runs on GitHub -- nothing is built or hosted elsewhere:
#
#   pull request / push to dev  ->  typecheck, unit tests, build, browser E2E
#   push to main                ->  the same, then deploy dist/ to GitHub Pages
#
# The site is fully static (OpenCASCADE runs in the visitor's browser as
# WebAssembly), so GitHub Pages is the production host.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Newer pushes supersede older runs, except on main where a deploy must
# never be cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (validation + real OpenCASCADE geometry)
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser for E2E
        run: npx playwright install --with-deps chromium

      - name: E2E (production build in Chromium)
        run: npm run e2e

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
