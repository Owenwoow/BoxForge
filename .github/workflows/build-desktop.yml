name: Build desktop apps

# Builds the standalone BoxForge desktop app (Streamlit UI packaged with
# PyInstaller) for every supported platform, smoke-tests each binary, and -- on
# a version tag -- publishes the archives to a single GitHub Release.
#
#   - Push a tag like `v0.1.0`  -> build all platforms + publish a Release.
#   - Run manually (Actions tab) -> build all platforms, artifacts only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Re-running for the same tag/branch replaces the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-amd64
          - os: macos-latest # Apple Silicon runner
            label: macos-arm64
          # macOS Intel (macos-13) is intentionally omitted: those runners are
          # scarce and routinely leave the whole release blocked in the queue.
          # Apple Silicon covers all Macs sold since late 2020; Intel-Mac users
          # can run from source or via Docker.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      # OCP / OpenCASCADE links against X11/OpenGL libs even headless; they must
      # be present for the smoke test to import CadQuery on the Linux runner.
      - name: Install OCP system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libx11-6 libxext6 libxrender1 \
            libsm6 libice6 libfontconfig1 libglib2.0-0 libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller packaging/boxforge.spec --noconfirm

      - name: Smoke test the binary (Windows)
        if: runner.os == 'Windows'
        run: python packaging/smoke_test.py dist/BoxForge/BoxForge.exe

      - name: Smoke test the binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: python packaging/smoke_test.py dist/BoxForge/BoxForge

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/BoxForge/* -DestinationPath BoxForge-${{ matrix.label }}.zip
        shell: pwsh

      - name: Package archive (Linux / macOS)
        if: runner.os != 'Windows'
        run: tar -C dist -czf BoxForge-${{ matrix.label }}.tar.gz BoxForge

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: BoxForge-${{ matrix.label }}
          path: BoxForge-${{ matrix.label }}.*
          if-no-files-found: error

  # Single job publishes all archives at once. A per-matrix-job release step
  # would have every platform race to create/update the same Release
  # concurrently (one wins, the others 404 on the asset upload), so collecting
  # the artifacts and releasing once is the reliable pattern.
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release and upload assets
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # Tags like v0.2.0-rc.1 / v0.2.0-beta are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
