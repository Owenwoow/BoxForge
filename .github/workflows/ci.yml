name: CI

# The whole web-app pipeline runs here: lint -> tests -> Docker image.
#
#   - Pull request          -> lint + tests + build & smoke-test the image (no push).
#   - Push to `dev`         -> ... + publish ghcr.io/<owner>/boxforge:dev
#   - Push to `main`        -> ... + publish :edge
#   - Push a tag `vX.Y.Z`   -> ... + publish :X.Y.Z, :X.Y and :latest
#
# Desktop apps for the GitHub Release are built by build-desktop.yml.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# A newer push to the same branch/PR supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install ruff

      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest Pythons CadQuery ships wheels for, plus the one
        # the Docker image and desktop builds use.
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # OCP / OpenCASCADE links against X11/OpenGL libs even headless.
      - name: Install OCP system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libx11-6 libxext6 libxrender1 \
            libsm6 libice6 libfontconfig1 libglib2.0-0 libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest
        run: pytest

      - name: Desktop launcher self-test
        run: python box_generator/desktop_app.py --selftest

  docker:
    name: Docker image
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Pull requests (incl. forks) only build and test the image.
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: boxforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - CadQuery build inside the image
        run: docker run --rm -w /tmp boxforge:ci python /app/main.py /app/config.yaml

      - name: Smoke test - web UI health endpoint
        run: |
          docker run -d --name boxforge -p 8501:8501 boxforge:ci
          for i in $(seq 1 60); do
            if [ "$(curl -fsS http://localhost:8501/_stcore/health 2>/dev/null)" = "ok" ]; then
              echo "Streamlit is healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::container never became healthy"
          docker logs boxforge
          exit 1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # `latest` is added automatically for semver tag pushes only.
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same Dockerfile + warm layer cache, so this is a fast re-export of the
      # exact image that just passed the smoke tests.
      - name: Publish image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Published image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
