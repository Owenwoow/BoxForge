name: CI

# Lint + tests on every push / PR to main & dev. Required to pass before a PR
# can merge into main. Releases are published by release.yml.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# A newer push to the same branch/PR supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install ruff

      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python-version }})
    # Pinned: the apt package names below are distro-specific, and
    # ubuntu-latest is moving to 26.04. Bump deliberately, not by surprise.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest Pythons CadQuery ships wheels for, plus the one
        # the Codespaces dev container uses.
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # OCP / OpenCASCADE links against X11/OpenGL libs even headless.
      - name: Install OCP system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libx11-6 libxext6 libxrender1 \
            libsm6 libice6 libfontconfig1 libglib2.0-0 libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest
        run: pytest
